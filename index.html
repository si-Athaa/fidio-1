<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YourTab-OS</title>
<style>
  body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
  }
  header {
    background: #202020;
    padding: 12px 20px;
    font-size: 22px;
    font-weight: bold;
    color: #ff0000;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #333;
  }
  .container { display: flex; flex-wrap: wrap; }
  .main { flex: 3; padding: 20px; min-width: 600px; }
  
  /* Container Player agar konsisten */
  .player-container {
    width: 100%;
    background: black;
    border-radius: 12px;
    overflow: hidden;
    aspect-ratio: 16 / 9;
    position: relative;
  }
  video, iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .title { margin-top: 15px; font-size: 22px; font-weight: bold; }
  
  .sidebar {
    flex: 1;
    background: #0f0f0f;
    padding: 10px;
    height: calc(100vh - 60px);
    overflow-y: auto;
    min-width: 350px;
  }
  .item {
    display: flex;
    gap: 12px;
    padding: 8px;
    cursor: pointer;
    border-radius: 8px;
    transition: 0.2s;
  }
  .item:hover { background: #272727; }
  .thumb {
    width: 140px;
    height: 80px;
    background: #222;
    border-radius: 8px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #555;
    overflow: hidden;
  }
  .item-title { font-size: 14px; font-weight: 500; line-height: 1.4; }

  @media (max-width: 900px) {
    .container { flex-direction: column; }
    .main, .sidebar { min-width: 100%; height: auto; }
  }
</style>
</head>

<body>

<header>▶ YourTube</header>

<div class="container">

  <div class="main">
    <div class="player-container" id="videoContainer">
      <iframe src="https://go.screenpal.com/player/cOhI0LntTOE?ff=1&ahc=1&dcc=1&tl=1&bg=transparent&share=1&download=1&embed=1&cl=1" allowfullscreen="true"></iframe>
    </div>
    <div class="title" id="videoTitle">ravyn-lenae|love-me-not</div>
  </div>

  <div class="sidebar">

    <div class="item" onclick="playEmbed('cOhI0LntTOE','Tutorial Video Bagian 1')">
      <div class="thumb"><img src="https://go.screenpal.com/consumption/player_appearance/cOhI0LntTOE/1.777778" style="width:100%"></div>
      <div class="item-title">ravyn-lenae|love-me-not</div>
    </div>

    <div class="item" onclick="playEmbed('cOh2ccntTt2','Tutorial Video Bagian 2')">
      <div class="thumb"><img src="https://go.screenpal.com/consumption/player_appearance/cOh2ccntTt2/1.777778" style="width:100%"></div>
      <div class="item-title">8-letters</div>
    </div>

    <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">

    <div class="item" onclick="playLocal('vierraxwishyouwerehere.mp4','Vierra – Wish You Were Here')">
      <div class="thumb">MP4</div>
      <div class="item-title">Vierra – Wish You Were Here</div>
    </div>

    <div class="item" onclick="playLocal('itshardtoseeyou.mp4','itshardtoseeyou')">
      <div class="thumb">MP4</div>
      <div class="item-title">failed</div>
    </div>

    <div class="item" onclick="playLocal('ilikeyouthemost.mp4','I Like You The Most')">
      <div class="thumb">MP4</div>
      <div class="item-title">I Like You The Most</div>
    </div>

    <div class="item" onclick="playLocal('payphone.mp4','Maroon 5 – Payphone')">
      <div class="thumb">MP4</div>
      <div class="item-title">Maroon 5 – Payphone</div>
    </div>

    </div>
</div>

<script>
// Fungsi untuk memutar dari ScreenPal (Embed)
function playEmbed(id, title) {
  const container = document.getElementById("videoContainer");
  container.innerHTML = `<iframe src="https://go.screenpal.com/player/${id}?ff=1&ahc=1&dcc=1&tl=1&bg=transparent&share=1&download=1&embed=1&cl=1" allowfullscreen="true"></iframe>`;
  document.getElementById("videoTitle").innerText = title;
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// Fungsi untuk memutar file MP4 lokal
function playLocal(file, title) {
  const container = document.getElementById("videoContainer");
  container.innerHTML = `<video controls autoplay><source src="${file}" type="video/mp4"></video>`;
  document.getElementById("videoTitle").innerText = title;
  window.scrollTo({top: 0, behavior: 'smooth'});
}
</script>

</body>
</html>
